<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Encurtador</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        #result {
            margin-top: 15px;
            word-break: break-all;
        }

        a {
            color: #4caf50;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Encurtador de Links</h2>
    <input id="url" placeholder="Cole seu link aqui">
    <button onclick="shorten()">Encurtar</button>
    <div id="result"></div>
</div>

<script>
    function generateCode() {
        return Math.random().toString(36).substring(2, 7);
    }

    function shorten() {
        const input = document.getElementById("url");
        const url = input.value.trim();
        if (!url) return;

        const code = generateCode();

        const links = JSON.parse(localStorage.getItem("links") || "{}");
